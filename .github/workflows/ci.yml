name: proof-graphs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Elan
        run: curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
      - name: Build
        run: ~/.elan/bin/lake build && ~/.elan/bin/lake build ProofNetIR
      - name: Extract and count the fixtures
        run: |
          ~/.elan/bin/lake exe proof_graph_extract Fixtures fixtures/Fixtures.lean > fixtures.jsonl
          python scripts/count_linearizations.py < fixtures.jsonl > counts.jsonl
          python - <<'PY'
          import json
          rows = {json.loads(l)["declaration"]: json.loads(l)["linearizations"] for l in open("counts.jsonl")}
          assert rows == {"chain": "1", "star": "6", "mixed": "80", "arithmetic": "1", "cases_fixture": "2", "nested_cases": "8"}, rows
          print("fixtures ok", rows)
          PY
      - name: Check the committed linearization experiment
        run: |
          if test -f experiments/linearizations-v0.1/results.jsonl; then
            python scripts/run_linearizations.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Fetch the Mathlib build cache
        run: ~/.elan/bin/lake exe cache get
      - name: Check the committed Mathlib-slice experiment
        run: |
          if test -f experiments/linearizations-mathlib-v0.1/results.jsonl; then
            python scripts/run_mathlib_slice.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed search experiment
        run: |
          if test -f experiments/search-v0.1/results.jsonl; then
            ~/.elan/bin/lake build repl
            python scripts/run_search.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed dataset
        run: python scripts/export_graphs.py --check
      - name: Audit the structural invariants of every derived graph
        run: python scripts/audit_graphs.py
      - name: Check the committed golf experiment
        run: |
          if test -f experiments/golf-v0.1/results.jsonl; then
            python scripts/run_golf.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed deep-search experiment
        run: |
          if test -f experiments/search-v0.2/results.jsonl; then
            ~/.elan/bin/lake build repl
            python scripts/run_search_deep.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed population search experiment
        run: |
          if test -f experiments/search-v0.3/summary.json; then
            ~/.elan/bin/lake build repl
            python scripts/run_search_wide.py --check-committed
            python scripts/search_v03_sensitivity.py
          else
            echo "no committed results yet"
          fi
      - name: Check the committed golf-structure experiment
        run: |
          if test -f experiments/golf-structure-v0.1/results.jsonl; then
            python scripts/run_golf_structure.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed extraction audit
        run: |
          if test -f experiments/extraction-audit-v0.1/results.jsonl; then
            python scripts/run_extraction_audit.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed audit of the constructs the derivation handles by rule
        run: |
          if test -f experiments/extraction-audit-v0.2/results.jsonl; then
            python scripts/run_extraction_audit_v2.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed audit of long proofs and graphs that are not forests
        run: |
          if test -f experiments/extraction-audit-v0.3/results.jsonl; then
            python scripts/run_extraction_audit_v3.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed goal-identity search experiment
        run: |
          if test -f experiments/search-v0.4/summary.json; then
            python scripts/run_search_keys.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed golf replication
        run: |
          if test -f experiments/golf-v0.2/summary.json; then
            python scripts/run_golf_replication.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed step-prover search
        run: |
          if test -f experiments/search-v0.5/summary.json; then
            python scripts/run_search_prover.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed shared-draw search
        run: |
          if test -f experiments/search-v0.6/summary.json; then
            python scripts/run_search_paired.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Test the renaming step, in print and in Lean
        run: |
          python scripts/test_renaming.py
          ~/.elan/bin/lake build repl
          python scripts/check_renaming_repl.py
          python scripts/check_goal_identity.py
          python scripts/check_faithful_repl.py
      - name: Test the typed goal identity, in Python and in Lean, and audit keys-v0.1's denominators
        run: |
          python scripts/test_goal_identity_typed.py
          python scripts/check_identity_v2_repl.py
          python scripts/test_audit_key_denominators.py
          python scripts/audit_key_denominators.py --check
      - name: Test the goal-selection searches and check their committed results
        run: |
          python scripts/test_goal_selection.py
          python scripts/test_goal_selection_diagnostic.py
          if test -f experiments/goal-selection-v0.1/summary.json; then
            python scripts/run_search_goal_selection.py --check-committed
          else
            echo "no committed goal-selection results yet"
          fi
          if test -f experiments/goal-selection-diagnostic-v0.1/summary.json; then
            python scripts/run_goal_selection_diagnostic.py --check-committed
          else
            echo "no committed diagnostic results yet"
          fi
      - name: Check the committed renaming search
        run: |
          if test -f experiments/search-v0.7/summary.json; then
            python scripts/run_search_renaming.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the goal-key audit
        run: python scripts/audit_goal_keys.py --check
      - name: Check the committed replay re-keyed by Lean expressions
        run: |
          if test -f experiments/keys-v0.1/summary.json; then
            python scripts/run_key_replay.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed search over coupled goal groups
        run: |
          if test -f experiments/search-v0.8/summary.json; then
            python scripts/run_search_coupled.py --check-committed
            python scripts/explore_range_rerun_v08.py --check
          else
            echo "no committed results yet"
          fi
      - name: Check the committed search with 256 expansions
        run: |
          if test -f experiments/search-v0.9/summary.json; then
            python scripts/run_search_coupled_deep.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed goal identity up to definitional equality
        run: |
          if test -f experiments/defeq-v0.1/summary.json; then
            python scripts/run_defeq_replay.py --check-committed
            python scripts/defeq_v01_amendment.py --check
            python scripts/defeq_v01_c32_mechanism.py --check
            python scripts/explore_defeq_merges.py --check
          else
            echo "no committed results yet"
          fi
      - name: Check what a heartbeat limit set inside a tactic bounds
        run: |
          ~/.elan/bin/lake build repl
          python scripts/check_tactic_heartbeats.py
      - name: Check the cost curves against the committed rows
        run: python scripts/explore_cost_curves.py --check
      - name: Check the committed searches with the typed key
        run: |
          if test -f experiments/search-v0.10/summary.json; then
            python scripts/run_search_typed.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed searches under the enforced heartbeat limit
        run: |
          if test -f experiments/heartbeats-v0.1/summary.json; then
            python scripts/run_search_heartbeats.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Test the held-out comparison and check its committed results
        run: |
          python scripts/test_search_confirm.py
          if test -f experiments/search-v0.11/preregistration.json; then
            python scripts/run_search_confirm.py --check-committed
          else
            echo "not registered yet"
          fi
      - name: Check the golf replication clustered by commit
        run: python scripts/golf_clusters.py --check
      - name: Check the committed holdout slice
        run: |
          if test -f experiments/holdout-v0.1/summary.json; then
            python scripts/run_holdout.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed orderings replay
        run: |
          if test -f experiments/orderings-replay-v0.1/summary.json; then
            python scripts/run_orderings_replay.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed second orderings replay
        run: |
          if test -f experiments/orderings-replay-v0.2/summary.json; then
            python scripts/run_orderings_replay_v2.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check that the replay's sample rule admits a proof with a shared metavariable, whose other ordering fails
        run: |
          ~/.elan/bin/lake build repl
          python scripts/check_coupled_orderings.py
      - name: Check the committed recount and the corrected dataset
        run: |
          if test -f experiments/recount-v0.1/summary.json; then
            python scripts/run_recount.py --check-committed
          else
            echo "no committed results yet"
          fi
