name: proof-graphs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Elan
        run: curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
      - name: Build
        run: ~/.elan/bin/lake build && ~/.elan/bin/lake build ProofNetIR
      - name: Extract and count the fixtures
        run: |
          ~/.elan/bin/lake exe proof_graph_extract Fixtures fixtures/Fixtures.lean > fixtures.jsonl
          python scripts/count_linearizations.py < fixtures.jsonl > counts.jsonl
          python - <<'PY'
          import json
          rows = {json.loads(l)["declaration"]: json.loads(l)["linearizations"] for l in open("counts.jsonl")}
          assert rows == {"chain": "1", "star": "6", "mixed": "80", "arithmetic": "1", "cases_fixture": "2", "nested_cases": "8"}, rows
          print("fixtures ok", rows)
          PY
      - name: Check the committed linearization experiment
        run: |
          if test -f experiments/linearizations-v0.1/results.jsonl; then
            python scripts/run_linearizations.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Fetch the Mathlib build cache
        run: ~/.elan/bin/lake exe cache get
      - name: Check the committed Mathlib-slice experiment
        run: |
          if test -f experiments/linearizations-mathlib-v0.1/results.jsonl; then
            python scripts/run_mathlib_slice.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed search experiment
        run: |
          if test -f experiments/search-v0.1/results.jsonl; then
            ~/.elan/bin/lake build repl
            python scripts/run_search.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed dataset
        run: python scripts/export_graphs.py --check
      - name: Audit the structural invariants of every derived graph
        run: python scripts/audit_graphs.py
      - name: Check the committed golf experiment
        run: |
          if test -f experiments/golf-v0.1/results.jsonl; then
            python scripts/run_golf.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed deep-search experiment
        run: |
          if test -f experiments/search-v0.2/results.jsonl; then
            ~/.elan/bin/lake build repl
            python scripts/run_search_deep.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed population search experiment
        run: |
          if test -f experiments/search-v0.3/summary.json; then
            ~/.elan/bin/lake build repl
            python scripts/run_search_wide.py --check-committed
            python scripts/search_v03_sensitivity.py
          else
            echo "no committed results yet"
          fi
      - name: Check the committed golf-structure experiment
        run: |
          if test -f experiments/golf-structure-v0.1/results.jsonl; then
            python scripts/run_golf_structure.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed extraction audit
        run: |
          if test -f experiments/extraction-audit-v0.1/results.jsonl; then
            python scripts/run_extraction_audit.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed goal-identity search experiment
        run: |
          if test -f experiments/search-v0.4/summary.json; then
            python scripts/run_search_keys.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed golf replication
        run: |
          if test -f experiments/golf-v0.2/summary.json; then
            python scripts/run_golf_replication.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed step-prover search
        run: |
          if test -f experiments/search-v0.5/summary.json; then
            python scripts/run_search_prover.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed shared-draw search
        run: |
          if test -f experiments/search-v0.6/summary.json; then
            python scripts/run_search_paired.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed holdout slice
        run: |
          if test -f experiments/holdout-v0.1/summary.json; then
            python scripts/run_holdout.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed orderings replay
        run: |
          if test -f experiments/orderings-replay-v0.1/summary.json; then
            python scripts/run_orderings_replay.py --check-committed
          else
            echo "no committed results yet"
          fi
      - name: Check the committed recount and the corrected dataset
        run: |
          if test -f experiments/recount-v0.1/summary.json; then
            python scripts/run_recount.py --check-committed
          else
            echo "no committed results yet"
          fi
